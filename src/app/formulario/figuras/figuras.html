<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Página Web</title>
</head>
<body>

<div class="container mt-4">

    <div class="form-group pt-4">

        <label for="base" class="form-label">
            Base:
        </label>

        <input
            [(ngModel)]="base"
            type="number"
            name="base"
            class="form-control"
            id="base"
            placeholder="Ingresa la base">

    </div>

    <div class="form-group pt-4">

        <label for="altura" class="form-label">
            Altura:
        </label>

        <input
            [(ngModel)]="altura"
            type="number"
            name="altura"
            class="form-control"
            id="altura"
            placeholder="Ingresa la altura">

    </div>

    <div class="form-group pt-4">

        <label class="form-label">
            Escoge una figura:
        </label>

        <div>
            <input
                [(ngModel)]="figura"
                type="radio"
                name="figura"
                [value]="1"
                id="rectangulo">

            <label for="rectangulo">
                Rectángulo
            </label>
        </div>

        <div>
            <input
                [(ngModel)]="figura"
                type="radio"
                name="figura"
                [value]="2"
                id="cuadrado">

            <label for="cuadrado">
                Cuadrado
            </label>
        </div>

        <div>
            <input
                [(ngModel)]="figura"
                type="radio"
                name="figura"
                [value]="3"
                id="triangulo">

            <label for="triangulo">
                Triángulo
            </label>
        </div>

        <div>
            <input
                [(ngModel)]="figura"
                type="radio"
                name="figura"
                [value]="4"
                id="circulo">

            <label for="circulo">
                Círculo
            </label>
        </div>

        <div>
            <input
                [(ngModel)]="figura"
                type="radio"
                name="figura"
                [value]="5"
                id="pentagono">

            <label for="pentagono">
                Pentágono
            </label>
        </div>

    </div>

    <div class="pt-4">

        <button
            type="button"
            class="btn btn-primary"
            (click)="calcularArea()">
            Calcular área
        </button>

    </div>

    <div class="pt-3">

        <h5>
            Área: {{ area }}
        </h5>

    </div>

</div>

</body>
</html>
</body>
</html>
