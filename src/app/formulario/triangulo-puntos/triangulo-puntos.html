<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puntos del triángulo</title>
</head>
<body>
  <div class="container mt-5">
    <div class="card shadow">
      <div class="card-body">
        <h1 class="text-center mb-4">
          Puntos del triángulo
        </h1>
        <div class="row">
          <div class="col-md-4 mb-3">
            <div class="card h-100">
              <div class="card-body">
                <h2 class="card-title">
                  Punto A
                </h2>
                <div class="mb-3">
                  <label class="form-label">X:</label>
                  <input
                    type="text"
                    class="form-control"
                    [(ngModel)]="x1">
                </div>
                <div class="mb-3">
                  <label class="form-label">Y:</label>
                  <input
                    type="text"
                    class="form-control"
                    [(ngModel)]="y1">
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-4 mb-3">
            <div class="card h-100">
              <div class="card-body">
                <h2 class="card-title">
                  Punto B
                </h2>
                <div class="mb-3">
                  <label class="form-label">X:</label>
                  <input
                    type="text"
                    class="form-control"
                    [(ngModel)]="x2">
                </div>
                <div class="mb-3">
                  <label class="form-label">Y:</label>
                  <input
                    type="text"
                    class="form-control"
                    [(ngModel)]="y2">
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-4 mb-3">
            <div class="card h-100">
              <div class="card-body">
                <h2 class="card-title">
                  Punto C
                </h2>
                <div class="mb-3">
                  <label class="form-label">X:</label>
                  <input
                    type="text"
                    class="form-control"
                    [(ngModel)]="x3">
                </div>
                <div class="mb-3">
                  <label class="form-label">Y:</label>
                  <input
                    type="text"
                    class="form-control"
                    [(ngModel)]="y3">
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="text-center mt-3">
          <button
            type="button"
            class="btn btn-primary"
            (click)="analizarPuntos()">
            Analizar puntos
          </button>
        </div>
        <div class="alert alert-light border mt-4">
          <h2>RESULTADO</h2>
          <p>
            <strong>Punto A:</strong>
            ({{ x1 }}, {{ y1 }})
          </p>
          <p>
            <strong>Punto B:</strong>
            ({{ x2 }}, {{ y2 }})
          </p>
          <p>
            <strong>Punto C:</strong>
            ({{ x3 }}, {{ y3 }})
          </p>
          <p>
            <strong>{{ resultado }}</strong>
          </p>
          <p>
            <strong>Área:</strong>
            {{ area }} unidades cuadradas
          </p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
