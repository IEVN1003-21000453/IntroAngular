<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de sesión</title>
</head>
<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow">
          <div class="card-body p-4">
            <h1 class="text-center mb-4">
              INICIO DE SESIÓN
            </h1>
            <div class="mb-3">
              <label class="form-label">
                Usuario:
              </label>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="usuario">
            </div>
            <div class="mb-3">
              <label class="form-label">
                Contraseña:
              </label>
              <input
                type="password"
                class="form-control"
                [(ngModel)]="contrasena">
            </div>
            <div class="d-grid">
              <button
                type="button"
                class="btn btn-primary"
                (click)="validarUsuario()">
                Iniciar sesión
              </button>
            </div>
            <div class="alert alert-light border text-center mt-4">
              <p class="mb-0">
                {{ mensaje }}
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
