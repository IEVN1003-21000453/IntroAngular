<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palindromo</title>
</head>
<body>
  <div class="container mt-5">
    <div class="card shadow">
      <div class="card-body">
        <h1 class="text-center mb-4">
          Palíndromo
        </h1>
        <div class="mb-3">
          <label class="form-label">
            Escribe una palabra:
          </label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="texto"
          >
        </div>
        <div class="text-center">
          <button
            type="button"
            class="btn btn-primary"
            (click)="analizarFrase()">
            Analizar
          </button>
        </div>
        <div class="alert alert-light border mt-4">
          <h3 class="mb-3">
            Resultado
          </h3>
          <p>
            <strong>Número de vocales:</strong>
            {{ vocales }}
          </p>
          <p>
            <strong>Número de consonantes:</strong>
            {{ consonantes }}
          </p>
          <p>
            <strong>Palíndromo:</strong>
            {{ palindromo }}
          </p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
